[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "columnar_cl_fabricpc"
version = "0.1.0"
description = "Columnar continual learning experiments using FabricPC"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "columnarCL-fabricPC Authors"}
]
keywords = ["continual-learning", "predictive-coding", "jax", "columnar"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Private :: Do Not Upload",
]

dependencies = [
    # FabricPC from local editable install
    "fabricpc",
    # Inherit FabricPC dependency floors
    "jax",
    "jaxlib",
    "optax>=0.1.7",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
# Backend selection delegated to JAX
cuda12 = [
    "jax[cuda12]",
]
cuda13 = [
    "jax[cuda13]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["columnar_cl_fabricpc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
